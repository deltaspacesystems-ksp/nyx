# Nyx - prywatny czat (https://nyx.deltatechksp.eu).
# Ten plik jest dolaczany z nginx.conf (blok http) linia:  include nyx.conf;
# Dodaje go i przeladowuje nginx skrypt nyx.ps1 (nyx.bat nginx) - z testem i cofnieciem zmian.
#
# Zalozenia, spojne z reszta konfiguracji:
#  - ruch tylko przez Cloudflare ($osm_from_cf z cloudflare_ips.conf), bezposrednie wejscia na IP -> 403
#  - backend Nyx slucha wylacznie na 127.0.0.1:5200
#  - zmienna $connection_upgrade jest zdefiniowana w nginx.conf (mapa dla WebSocketow)
#
# Warstwy ochrony (serwer Nyx ma wlasne limity per uzytkownik; te tutaj chronia zanim ruch dojdzie do niego):
#  - limity zapytan na adres klienta zza Cloudflare: logowanie (ostro), reszta API (luzniej), pliki (osobno)
#  - limit rownoczesnych polaczen na adres
#  - male ciala zapytan wszedzie poza wysylaniem plikow (kawalki do 64 MB)

limit_req_zone  $http_cf_connecting_ip zone=nyx_auth:1m  rate=20r/m;
limit_req_zone  $http_cf_connecting_ip zone=nyx_api:10m  rate=40r/s;
limit_req_zone  $http_cf_connecting_ip zone=nyx_blob:10m rate=10r/s;
limit_conn_zone $http_cf_connecting_ip zone=nyx_conn:10m;

server {
    listen       80;
    server_name  nyx.deltatechksp.eu;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  nyx.deltatechksp.eu;

    # Certyfikat Cloudflare Origin obejmuje *.deltatechksp.eu
    ssl_certificate      C:/Users/brzoz/Documents/nginx-1.29.5/cert.pem;
    ssl_certificate_key  C:/Users/brzoz/Documents/nginx-1.29.5/cert.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    if ($osm_from_cf = 0) { return 403; }

    server_tokens off;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn        nyx_conn 40;

    # Domyslnie male zapytania; wysylanie plikow ma wlasny lokalizator nizej.
    client_max_body_size    1m;
    proxy_request_buffering off;
    proxy_buffering         off;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    # Prawdziwy adres klienta zza Cloudflare (limity prob logowania licza sie na osobe, nie na nginx).
    proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header   X-Forwarded-Proto https;

    # Realtime (SignalR po WebSockecie) - dlugie polaczenie.
    location /hub {
        limit_conn         nyx_conn 20;
        proxy_pass         http://127.0.0.1:5200;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Logowanie, rejestracja, odswiezanie tokenu: najostrzejszy limit.
    location /api/auth/ {
        limit_req          zone=nyx_auth burst=15 nodelay;
        proxy_pass         http://127.0.0.1:5200;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Pliki: kawalki do 64 MB (Cloudflare tnie pojedyncze zadania przy 100 MB), wolniejsze lacza.
    location /api/blobs/ {
        limit_req               zone=nyx_blob burst=60 nodelay;
        client_max_body_size    80m;
        proxy_pass              http://127.0.0.1:5200;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /api/ {
        limit_req          zone=nyx_api burst=120 nodelay;
        proxy_pass         http://127.0.0.1:5200;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Strona pobierania aplikacji i pliki (duze, wolne lacza): bez buforowania, dluzsze limity czasu.
    # Natywne okienko logowania przegladarki (plik conf/nyx_download.htpasswd) - tylko po to, zeby przypadkowi ludzie nie pobierali.
    location /downloadnyx {
        auth_basic           "Nyx download";
        auth_basic_user_file nyx_download.htpasswd;
        limit_req          zone=nyx_api burst=20 nodelay;
        proxy_set_header   Authorization "";
        proxy_pass         http://127.0.0.1:5200;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Aplikacja webowa i reszta.
    location / {
        proxy_pass         http://127.0.0.1:5200;
        proxy_read_timeout 60s;
    }
}
